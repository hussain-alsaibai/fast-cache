name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest test_fast_cache.py test_fast_cache_v071.py test_fast_cache_v072.py test_version_consistency.py tests/test_v060_metrics.py tests/test_v070_cache_method.py tests/test_v073_staticmethod_py38.py -v
