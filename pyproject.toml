[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-cache"
version = "0.8.0"
description = "Zero-dependency LRU + TTL + stale-while-revalidate cache for Python. 2.2M ops/s, sync + async."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["cache", "lru", "ttl", "swerv", "stale-while-revalidate", "memoize"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools]
# This is a flat-layout project with many top-level modules: the main
# fast_cache.py, the historical version sidecars, the newer _v072/_v080
# sidecars, benchmark scripts and several test files. setuptools refuses to
# auto-discover a flat layout with more than one top-level module, and the
# build failed with:
#
#   error: Multiple top-level modules discovered in a flat-layout: [...]
#
# So the modules that ship are listed explicitly. The benchmark scripts and
# the test files are deliberately excluded.
py-modules = [
    "fast_cache",
    "fast_cache_v071",
    "fast_cache_v072",
    "_v072",
    "_v080",
]
